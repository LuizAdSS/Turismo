<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - Parque das Aves</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Mantendo o mesmo padrão visual */
        .booking-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-family: 'Poppins', sans-serif;
        }
        .booking-banner {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }
        .btn-submit {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #218838;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007BFF;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="booking-container">
        <a href="index.html" class="back-link">&larr; Voltar para o Início</a>
        
        <img src="https://viladumont.com.br/wp-content/uploads/2015/03/Parque-das-aves.jpg" alt="Parque das Aves" class="booking-banner">
        
        <h2>Reservar Visita - Parque das Aves</h2>
        <p>Entre em viveiros imensos e viva uma experiência única de conexão e preservação da Mata Atlântica.</p>
        
        <form action="sucesso.html" method="POST">
            <div class="form-group">
                <label for="name">Nome Completo</label>
                <input type="text" id="name" required placeholder="Digite seu nome">
            </div>
            
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seuemail@exemplo.com">
            </div>
            
            <div class="form-group">
                <label for="date">Data da Visita</label>
                <input type="date" id="date" required>
            </div>
            
            <div class="form-group">
                <label for="tickets">Quantidade de Ingressos</label>
                <select id="tickets" required>
                    <option value="1">1 Ingresso</option>
                    <option value="2">2 Ingressos</option>
                    <option value="3">3 Ingressos</option>
                    <option value="4">4+ Ingressos</option>
                </select>
            </div>
            
            <button type="submit" class="btn-submit">Confirmar Reserva</button>
        </form>
    </div>
    <form action="sucesso.html" method="GET">
        <div class="form-group">
            <label for="name">Nome Completo</label>
            <input type="text" id="name" name="nome" required placeholder="Digite seu nome">
        </div>
        
        <input type="hidden" name="destino" value="Parque das Aves">
        
        <button type="submit" class="btn-submit">Confirmar Reserva</button>
    </form>
</body>
</html>
